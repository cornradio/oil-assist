<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>油耗记录系统</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>油耗记录系统</h1>
        </header>

        <!-- 车辆管理区域 -->
        <section class="section">
            <h2>车辆管理</h2>
            <div class="card">
                <button class="btn btn-primary" onclick="showAddVehicleModal()">+ 添加车辆</button>
                <div id="vehiclesList" class="vehicles-list"></div>
            </div>
        </section>

        <!-- 加油记录区域 -->
        <section class="section" id="refuelSection" style="display: none;">
            <div class="section-header">
                <h2>加油记录
                    <span class="header-actions">
                        <button class="btn-icon" onclick="exportRefuelRecords()" title="导出">导出</button>
                        <button class="btn-icon" onclick="showImportModal('refuel')" title="导入">导入</button>
                        <button class="btn-icon btn-icon-danger" onclick="clearRefuelRecords()" title="清空">清空</button>
                    </span>
                </h2>
            </div>
            <div class="card">
                <button class="btn btn-primary" onclick="showAddRecordModal()">+ 添加加油记录</button>
                <div id="recordsList" class="records-list"></div>
            </div>
        </section>

        <!-- 额外消费区域 -->
        <section class="section" id="expenseSection" style="display: none;">
            <div class="section-header">
                <h2>额外消费
                    <span class="header-actions">
                        <button class="btn-icon" onclick="exportExpenses()" title="导出">导出</button>
                        <button class="btn-icon" onclick="showImportModal('expense')" title="导入">导入</button>
                        <button class="btn-icon btn-icon-danger" onclick="clearExpenses()" title="清空">清空</button>
                    </span>
                </h2>
            </div>
            <div class="card">
                <button class="btn btn-primary" onclick="showAddExpenseModal()">+ 添加消费记录</button>
                <div id="expensesList" class="records-list"></div>
            </div>
        </section>

        <!-- 统计图表区域 -->
        <section class="section" id="statsSection" style="display: none;">
            <div class="section-header">
                <h2>统计图表
                    <span class="header-actions">
                        <button class="btn-icon" onclick="refreshStats()" title="刷新">刷新</button>
                    </span>
                </h2>
            </div>
            <div class="card">
                <div class="stats-info" id="statsInfo"></div>
                <div class="charts-container">
                    <div class="chart-wrapper">
                        <div class="chart-header">
                            <span>油耗趋势</span>
                            <button class="chart-expand-btn" onclick="expandChart('fuelConsumptionChart')" title="全屏查看">⛶</button>
                        </div>
                        <canvas id="fuelConsumptionChart"></canvas>
                    </div>
                    <div class="chart-wrapper">
                        <div class="chart-header">
                            <span>加油费用</span>
                            <button class="chart-expand-btn" onclick="expandChart('costChart')" title="全屏查看">⛶</button>
                        </div>
                        <canvas id="costChart"></canvas>
                    </div>
                    <div class="chart-wrapper">
                        <div class="chart-header">
                            <span>油价趋势</span>
                            <button class="chart-expand-btn" onclick="expandChart('priceChart')" title="全屏查看">⛶</button>
                        </div>
                        <canvas id="priceChart"></canvas>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- 添加车辆模态框 -->
    <div id="addVehicleModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('addVehicleModal')">&times;</span>
            <h3>添加车辆</h3>
            <form id="addVehicleForm" onsubmit="addVehicle(event)">
                <div class="form-group">
                    <label>车辆名称：</label>
                    <input type="text" id="vehicleName" required placeholder="例如：我的车">
                </div>
                <div class="form-group">
                    <label>当前里程数（公里）：</label>
                    <input type="number" id="vehicleMileage" step="0.1" required placeholder="例如：50000">
                </div>
                <button type="submit" class="btn btn-primary">添加</button>
            </form>
        </div>
    </div>

    <!-- 添加加油记录模态框 -->
    <div id="addRecordModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('addRecordModal')">&times;</span>
            <h3>添加加油记录</h3>
            <form id="addRecordForm" onsubmit="addRefuelRecord(event)">
                <div class="form-group">
                    <label>加油日期时间：</label>
                    <input type="datetime-local" id="recordDate" required>
                </div>
                <div class="form-group">
                    <label>加油升数（L）：</label>
                    <input type="number" id="recordLiters" step="0.01" required placeholder="例如：50.5">
                </div>
                <div class="form-group">
                    <label>价格（元）：</label>
                    <input type="number" id="recordPrice" step="0.01" required placeholder="例如：350.00">
                </div>
                <div class="form-group">
                    <label>加油时里程数（公里）：</label>
                    <input type="number" id="recordMileage" step="0.1" required placeholder="例如：50100">
                </div>
                <button type="submit" class="btn btn-primary">添加</button>
            </form>
        </div>
    </div>

    <!-- 编辑加油记录模态框 -->
    <div id="editRecordModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('editRecordModal')">&times;</span>
            <h3>编辑加油记录</h3>
            <form id="editRecordForm" onsubmit="updateRefuelRecord(event)">
                <input type="hidden" id="editRecordId">
                <div class="form-group">
                    <label>加油日期时间：</label>
                    <input type="datetime-local" id="editRecordDate" required>
                </div>
                <div class="form-group">
                    <label>加油升数（L）：</label>
                    <input type="number" id="editRecordLiters" step="0.01" required placeholder="例如：50.5">
                </div>
                <div class="form-group">
                    <label>价格（元）：</label>
                    <input type="number" id="editRecordPrice" step="0.01" required placeholder="例如：350.00">
                </div>
                <div class="form-group">
                    <label>加油时里程数（公里）：</label>
                    <input type="number" id="editRecordMileage" step="0.1" required placeholder="例如：50100">
                </div>
                <button type="submit" class="btn btn-primary">保存</button>
            </form>
        </div>
    </div>

    <!-- 添加额外消费模态框 -->
    <div id="addExpenseModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('addExpenseModal')">&times;</span>
            <h3>添加消费记录</h3>
            <form id="addExpenseForm" onsubmit="addExtraExpense(event)">
                <div class="form-group">
                    <label>消费日期：</label>
                    <input type="date" id="expenseDate" required>
                </div>
                <div class="form-group">
                    <label>消费标题：</label>
                    <input type="text" id="expenseTitle" required placeholder="例如：年检、保险、修车等">
                </div>
                <div class="form-group">
                    <label>金额（元）：</label>
                    <input type="number" id="expenseAmount" step="0.01" required placeholder="例如：500.00">
                </div>
                <button type="submit" class="btn btn-primary">添加</button>
            </form>
        </div>
    </div>

    <!-- 编辑额外消费模态框 -->
    <div id="editExpenseModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('editExpenseModal')">&times;</span>
            <h3>编辑消费记录</h3>
            <form id="editExpenseForm" onsubmit="updateExtraExpense(event)">
                <input type="hidden" id="editExpenseId">
                <div class="form-group">
                    <label>消费日期：</label>
                    <input type="date" id="editExpenseDate" required>
                </div>
                <div class="form-group">
                    <label>消费标题：</label>
                    <input type="text" id="editExpenseTitle" required placeholder="例如：年检、保险、修车等">
                </div>
                <div class="form-group">
                    <label>金额（元）：</label>
                    <input type="number" id="editExpenseAmount" step="0.01" required placeholder="例如：500.00">
                </div>
                <button type="submit" class="btn btn-primary">保存</button>
            </form>
        </div>
    </div>

    <!-- 导入数据模态框 -->
    <div id="importModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('importModal')">&times;</span>
            <h3 id="importModalTitle">导入数据</h3>
            <div class="form-group">
                <label>选择导入方式：</label>
                <div style="margin: 15px 0;">
                    <button type="button" class="btn btn-primary" onclick="document.getElementById('importFileInput').click()" style="margin-right: 10px;">选择文件</button>
                    <button type="button" class="btn btn-primary" onclick="pasteFromClipboard()">从剪切板粘贴</button>
                </div>
                <input type="file" id="importFileInput" accept=".csv,.txt" style="display: none;" onchange="handleFileImport(event)">
            </div>
            <div class="form-group">
                <label>或直接粘贴CSV数据：</label>
                <textarea id="importDataText" rows="10" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-family: monospace; font-size: 12px;" placeholder="粘贴CSV格式数据，第一行为表头"></textarea>
            </div>
            <div style="margin-top: 15px;">
                <button type="button" class="btn btn-primary" onclick="processImport()">导入</button>
                <button type="button" class="btn" onclick="closeModal('importModal')" style="margin-left: 10px;">取消</button>
            </div>
            <div id="importPreview" style="margin-top: 15px; display: none;">
                <h4>预览（前5行）：</h4>
                <pre id="importPreviewContent" style="background: #f5f5f5; padding: 10px; border-radius: 4px; max-height: 200px; overflow: auto;"></pre>
            </div>
        </div>
    </div>

    <!-- 全屏图表模态框 -->
    <div id="chartModal" class="modal" style="display: none;">
        <div class="modal-content chart-modal-content">
            <span class="close" onclick="closeChartModal()">&times;</span>
            <div id="chartModalCanvas"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
